# Harness targets generate() emits alongside the Claude Code plugins.
# "generic" writes a dependency-free Agent Skills tree to dist/generic/
# that any SKILL.md-standard harness (codex, opencode, ...) can consume.
targets = ["claude-code", "generic", "codex", "opencode"]

[marketplace]
name = "skillsmith-marketplace"
owner = { name = "Dakota" }

[categories]
allowed = ["engineering", "productivity", "misc"]

# Groupings assemble skills/agents/hooks/mcp into installable plugins.
# A skill belongs to exactly one plugin. Plugins are cut by job so a user
# installs only what a session needs: Claude Code lists every installed
# skill's description in the system prompt within ~1% of the context window
# and drops descriptions when that overflows (V17 keeps each plugin under
# half of that budget).
[[plugin]]
name = "architecture"
version = "0.1.0"
description = "Architecture discipline: specs, decision records, module depth, structural review, API contracts, migrations, failure modes"
skills = ["api-design", "architecture-review", "architecture-spec", "decision-record", "deep-modules", "failure-mode-analysis", "migration-plan"]

[[plugin]]
name = "planning"
version = "0.1.0"
description = "Before building: grill the idea, spec the feature, premortem the plan, falsify the conclusion, trace second-order effects"
skills = ["falsification-review", "feature-spec", "grilling", "premortem", "second-order-effects"]
agents = ["falsification-reviewer"]

[[plugin]]
name = "research"
version = "0.1.0"
description = "Live-source grounding: verify volatile facts, run fan-out research, land cited notes in the repo"
skills = ["deep-research", "ground-truth-research", "research-note"]

[[plugin]]
name = "code-craft"
version = "0.5.0"
description = "Implementation discipline: test-first loops, characterization tests, root-cause diagnosis, codebase orientation, post-mortems"
skills = ["codebase-survey", "diagnose-bugs", "postmortem", "retrofit-tests", "tdd"]

[[plugin]]
name = "dev-workflow"
version = "0.1.0"
description = "Moving work between people and sessions: handoffs, cold reads, work items, guided setup wizards"
skills = ["cold-read", "define-work-items", "handoff", "wizard"]
agents = ["cold-reader"]

[[plugin]]
name = "docs-craft"
version = "0.1.0"
description = "Technical writing for humans: READMEs, diagrams and tables, narration-free prose, information architecture"
skills = ["doc-visuals", "information-architecture", "prose-hygiene", "readme-authoring"]

[[plugin]]
name = "agent-instructions"
version = "0.1.0"
description = "Writing for agents: instruction files, skill authoring, the communication contract, and its guided setup"
skills = ["communication-contract", "instructions-setup", "skill-authoring", "writing-for-agents"]
commands = ["instructions-setup"]

[[plugin]]
name = "security"
version = "0.3.0"
description = "Security review discipline: threat modeling, diff-scoped review with sibling sweeps, decision-ready hardening proposals"
skills = ["hardening-proposal", "security-diff-review", "threat-model"]

[[plugin]]
name = "frontend"
version = "0.5.0"
description = "Frontend craft discipline: build high-craft web UI that refuses generic AI-default patterns, non-destructively audit and upgrade the craft of an existing interface, and verify UI behavior in a real browser with Playwright"
skills = ["frontend-craft", "frontend-critique", "frontend-redesign", "webapp-testing"]

[policy]
"max-skill-body-tokens" = 5000
"max-listing-chars" = 400            # V2: this catalog's per-skill description target (harness cap is 1536)
"max-plugin-listing-chars" = 4000    # V17: half a 200k-window listing budget per plugin
"min-trigger-hit-rate" = 0.85
"security-tier" = "strict"
"network-allowlist" = []
"composition-allowlist" = [
  "architecture-spec->doc-visuals",
  "architecture-spec->falsification-review",
  "codebase-survey->doc-visuals",
  "decision-record->ground-truth-research",
  "feature-spec->cold-read",
  "feature-spec->deep-modules",
  "grilling->ground-truth-research",
  "hardening-proposal->falsification-review",
  "postmortem->doc-visuals",
  "tdd->deep-modules",
]
