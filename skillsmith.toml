# Harness targets generate() emits alongside the Claude Code plugins.
# "generic" writes a dependency-free Agent Skills tree to dist/generic/
# that any SKILL.md-standard harness (codex, opencode, ...) can consume.
targets = ["claude-code", "generic", "codex", "opencode"]

[marketplace]
name = "skillsmith-marketplace"
owner = { name = "Dakota" }

[categories]
allowed = ["engineering", "productivity", "misc"]

# Groupings assemble skills/agents/hooks/mcp into installable plugins.
# A skill belongs to exactly one plugin.
[[plugin]]
name = "productivity-tools"
version = "0.2.0"
description = "Work discipline: handoffs, transitions, work-item definition, issue triage"
skills = ["cold-read", "define-work-items", "handoff", "issue-triage", "writing-for-agents"]
agents = ["cold-reader"]

[[plugin]]
name = "epistemics"
version = "0.7.0"
description = "Judgment discipline: elicitation grilling before work starts, premortems on agreed plans, falsification passes, adversarial review, crux identification, post-answer discernment nudges, live-source verification, durable research"
skills = ["deep-research", "discernment-nudge", "estimate", "falsification-review", "grilling", "ground-truth-research", "premortem", "research-note", "second-order-effects"]
agents = ["falsification-reviewer"]

[[plugin]]
name = "engineering-core"
version = "0.6.0"
description = "Engineering workflow orchestrators: specs, surveys, decisions, post-mortems, guided setup wizards — plus the information-architecture, doc-visuals, prose-hygiene, readme-authoring, and skill-authoring disciplines they compose"
skills = ["architecture-spec", "codebase-survey", "decision-record", "discovery-map", "doc-visuals", "feature-spec", "information-architecture", "postmortem", "prose-hygiene", "readme-authoring", "skill-authoring", "wizard"]

[[plugin]]
name = "code-craft"
version = "0.2.0"
description = "Implementation discipline: test-driven red-green loops, deep-module interface design, and disciplined root-cause diagnosis for bugs, flakes, and regressions"
skills = ["deep-modules", "diagnose-bugs", "tdd"]

[[plugin]]
name = "security"
version = "0.1.1"
description = "Security review discipline: repository threat modeling, diff-scoped review with sibling-instance sweeps, decision-ready hardening proposals, and SECURITY.md authoring"
skills = ["define-security-policy", "hardening-proposal", "security-diff-review", "threat-model"]

[[plugin]]
name = "frontend"
version = "0.3.0"
description = "Frontend craft discipline: build high-craft web UI that refuses generic AI-default patterns, non-destructively audit and upgrade the craft of an existing interface, and verify UI behavior in a real browser with Playwright"
skills = ["frontend-craft", "frontend-critique", "frontend-redesign", "webapp-testing"]

[[plugin]]
name = "marketing"
version = "0.2.1"
description = "Marketing discipline: content scoring, outbound sequences, content angle research, podcast repurposing, and growth experiment design"
skills = ["brand-voice", "content-angles", "content-scorer", "growth-experiments", "outbound-builder", "podcast-repurposer", "seo-brief"]

[[plugin]]
name = "tldraw-canvas"
version = "0.1.1"
description = "tldraw canvas tooling: author editable .tldr files from a description, convert Mermaid into tldraw shapes, and export canvases to images"
skills = ["mermaid-to-tldraw", "tldraw-animation", "tldraw-diagram", "tldraw-export"]

[[plugin]]
name = "secrets-ops"
version = "0.1.0"
description = "1Password-backed secret handling: convert projects to op:// references with op run, and load secrets into GitHub Actions via a scoped service account"
skills = ["op-github-secrets", "op-secrets"]

[[plugin]]
name = "pr-workflow"
version = "0.1.1"
description = "Pull-request workflow discipline: landing and propagating review fixes across dependent GitHub PR stacks with the official gh stack extension"
skills = ["stacked-prs"]

[[plugin]]
name = "agent-voice"
version = "0.1.0"
description = "How the agent talks: terse takeaway-last chat replies, summary-first files, one-line command reports — plus guided per-repo setup of those rules as managed instruction blocks"
skills = ["output-contract", "voice-setup"]
commands = ["voice-setup"]

[policy]
"max-skill-body-tokens" = 5000
"max-listing-chars" = 1536
"min-trigger-hit-rate" = 0.85
"security-tier" = "strict"
"network-allowlist" = []
"composition-allowlist" = [
  "architecture-spec->falsification-review",
  "decision-record->ground-truth-research",
  "discovery-map->cold-read",
  "discovery-map->define-work-items",
  "discovery-map->falsification-review",
  "discovery-map->ground-truth-research",
  "feature-spec->cold-read",
  "feature-spec->deep-modules",
  "hardening-proposal->falsification-review",
]
