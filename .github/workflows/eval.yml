name: Evaluation fixtures (offline)

# Subscription model runs happen locally with `codex login`.
# This workflow checks evaluation infrastructure without API keys or model calls.
on:
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Evaluation contracts and subscription runner
        run: bun test packages/core/test/eval.test.ts packages/core/test/effectiveness.test.ts packages/cli/test
      - run: bun packages/cli/src/main.ts validate --strict
