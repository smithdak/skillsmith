name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so version-guard can read the base branch's plugin bytes.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate (schema + quality + security, strict)
        run: bun packages/cli/src/main.ts validate --strict
      - name: Drift gate (committed artifacts == generate output)
        run: bun packages/cli/src/main.ts check
      - name: Version guard (a plugin content change requires a version bump)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree -w /dev/null)
            BASE_SHA=$(git -c user.name=CI -c user.email=ci@example.invalid commit-tree "$BASE_SHA" -m 'Empty initial baseline')
          fi
          bun packages/cli/src/main.ts version-guard --base "$BASE_SHA"
      - name: Tests
        run: bun test
      - name: Typecheck
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/cli typecheck
